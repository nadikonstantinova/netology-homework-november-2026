<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#647b91"/></marker></defs>
<rect width="1440" height="900" fill="#fff"/><g font-family="Arial, sans-serif">
<text x="50" y="55" font-size="34" font-weight="700" fill="#18354f">Горизонтальное разбиение базы</text>
<text x="50" y="95" font-size="22" fill="#52687b">План размещения строк разных магазинов</text><rect x="410" y="135" width="620" height="135" rx="14" fill="#edf5fc" stroke="#2868a8" stroke-width="2"/><text x="430" y="173" font-size="25" font-weight="700" fill="#2868a8">Приложение / маршрутизатор</text><text x="430" y="211" font-size="21" fill="#253545">Ключ размещения: store_id</text><text x="430" y="241" font-size="21" fill="#253545">Шард = store_id MOD 2</text><path d="M720,270 L350,345" fill="none" stroke="#647b91" stroke-width="3"  marker-end="url(#arrow)"/><rect x="85" y="350" width="530" height="225" rx="14" fill="#edf5fc" stroke="#2868a8" stroke-width="2"/><text x="105" y="388" font-size="25" font-weight="700" fill="#2868a8">Шард 0</text><text x="105" y="426" font-size="21" fill="#253545">Чётные store_id</text><text x="105" y="456" font-size="21" fill="#253545">Таблицы: users, books, stores</text><text x="105" y="486" font-size="21" fill="#253545">primary_0: чтение + запись</text><text x="105" y="516" font-size="21" fill="#253545">Операции магазина — локально</text><path d="M350,575 L350,685" fill="none" stroke="#647b91" stroke-width="3"  marker-end="url(#arrow)"/><text x="362.0" y="620.0" font-size="20" fill="#647b91">репликация</text><rect x="85" y="690" width="530" height="130" rx="14" fill="#eef9f3" stroke="#278266" stroke-width="2"/><text x="105" y="728" font-size="25" font-weight="700" fill="#278266">replica_0</text><text x="105" y="766" font-size="21" fill="#253545">Read-only, отдельный сервер</text><path d="M720,270 L1090,345" fill="none" stroke="#647b91" stroke-width="3"  marker-end="url(#arrow)"/><rect x="825" y="350" width="530" height="225" rx="14" fill="#edf5fc" stroke="#2868a8" stroke-width="2"/><text x="845" y="388" font-size="25" font-weight="700" fill="#2868a8">Шард 1</text><text x="845" y="426" font-size="21" fill="#253545">Нечётные store_id</text><text x="845" y="456" font-size="21" fill="#253545">Таблицы: users, books, stores</text><text x="845" y="486" font-size="21" fill="#253545">primary_1: чтение + запись</text><text x="845" y="516" font-size="21" fill="#253545">Операции магазина — локально</text><path d="M1090,575 L1090,685" fill="none" stroke="#647b91" stroke-width="3"  marker-end="url(#arrow)"/><text x="1102.0" y="620.0" font-size="20" fill="#647b91">репликация</text><rect x="825" y="690" width="530" height="130" rx="14" fill="#eef9f3" stroke="#278266" stroke-width="2"/><text x="845" y="728" font-size="25" font-weight="700" fill="#278266">replica_1</text><text x="845" y="766" font-size="21" fill="#253545">Read-only, отдельный сервер</text><text x="50" y="870" font-size="22" fill="#52687b">Общие отчёты: запросить оба шарда и объединить результаты на уровне приложения.</text></g></svg>